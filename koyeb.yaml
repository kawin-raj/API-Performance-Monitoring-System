# Koyeb App Specification
# Learn more: https://www.koyeb.com/docs/reference/app-specification
name: api-monitoring-hub
services:
  - name: web
    type: web
    git:
      branch: main
    build:
      type: dockerfile
      dockerfile: Dockerfile
    ports:
      - port: 3000
        path: /
    routes:
      - path: /
        port: 3000
    regions:
      - fra
    scalings:
      - min: 1
        max: 1
    instance_types:
      - type: nano
    health_checks:
      - http:
          port: 3000
          path: /api/health
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
